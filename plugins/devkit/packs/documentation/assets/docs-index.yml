name: Docs Index

# Keeps the README documentation index in sync with each doc's `description` frontmatter, and a
# "Back to README" link at the top of each docs/*.md. Runs the generator and, if anything
# changed, commits the updated README and docs back to the branch.

on:
  push:
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/generate-doc-index.mjs"
      - ".github/workflows/docs-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-doc-index:
    runs-on: ubuntu-latest
    # Don't react to the bot's own sync commit (belt-and-suspenders with [skip ci]).
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate README doc index and doc back-links
        run: node scripts/generate-doc-index.mjs

      - name: Commit the updated index and back-links if they changed
        run: |
          if [ -n "$(git status --porcelain README.md docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md docs
            git commit -m "docs: sync README doc index and back-links [skip ci]"
            git push
          else
            echo "README doc index and doc back-links already up to date."
          fi

# For pull requests from forks (where the token is read-only and a push would fail), validate
